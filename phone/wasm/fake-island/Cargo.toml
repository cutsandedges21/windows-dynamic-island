[package]
name = "fake-island"
version = "0.1.0"
edition = "2024"
license = "LicenseRef-Proprietary"
publish = false

# A stand-in for the island's phone side, for phone/e2e. Same iroh line as src-tauri/Cargo.toml.
[dependencies]
iroh = { version = "=1.3.0", default-features = false, features = ["tls-ring", "portmapper", "fast-apple-datapath"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-util", "io-std", "time", "sync"] }
serde_json = "1"
sha2 = "0.10"
data-encoding = "2"
anyhow = "1"
