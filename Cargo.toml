[workspace]
members = ["src-tauri", "hook"]
# phone/wasm is its own workspace (a wasm32 build plus its test island): scripts/phone.mjs.
exclude = ["phone"]
resolver = "2"

[workspace.package]
version = "0.4.2"
edition = "2021"
license = "LicenseRef-Proprietary"
authors = ["Moss"]

# The hook relay starts on every Claude Code event, so release builds favour
# a small, fast binary.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev.package."*"]
opt-level = 1
